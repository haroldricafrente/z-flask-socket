{% extends "base.html" %}

{% block title %}Mushkin - Live Feed{% endblock %}

{% block content %}
<h1>Live Feed</h1>

<ul class="breadcrumbs">
    <li><a href="{{ url_for('index') }}">Home</a></li>
    <li class="divider">/</li>
    <li><a href="{{ url_for('live') }}" class="active">Live</a></li>
</ul>

<!-- Dropdown for selecting size -->
<br>
<label for="sizeSelector">Select Camera Size:</label>
<select id="sizeSelector">
    <option value="small">Small</option>
    <option value="medium" selected>Medium</option>
    <option value="large">Large</option>
</select>

<div class="live-page">
    <div class="live-container">
        <div class="live-grid">
            <div class="camera-card">
                <div class="camera-header">
                    <h2>Chestnut Camera</h2>
                    <button class="capture-btn" onclick="captureImage('chestnut')">Capture</button>
                </div>
                <img id="chestnut-stream"
                     src="http://192.168.100.191:81/stream"
                     alt="Chestnut Camera Stream" class="camera-stream">
            </div>
            
            <div class="camera-card">
                <div class="camera-header">
                    <h2>Milky Camera</h2>
                    <button class="capture-btn" onclick="captureAndUploadImage('milky')">Capture</button>
                </div>
                <img id="milky-stream"
                     src="http://192.168.100.193:81/stream"
                     alt="Milky Camera Stream" class="camera-stream">
            </div>
            
            <div class="camera-card">
                <div class="camera-header">
                    <h2>Reishi Camera</h2>
                    <button class="capture-btn" onclick="captureImage('reishi')">Capture</button>
                </div>
                <img id="reishi-stream"
                     src="http://192.168.100.194:81/stream"
                     alt="Reishi Camera Stream" class="camera-stream">
            </div>
            
            <div class="camera-card">
                <div class="camera-header">
                    <h2>Shiitake Camera</h2>
                    <button class="capture-btn" onclick="captureAndUploadImage('shiitake')">Capture</button>
                </div>
                <img id="shiitake-stream"
                     src="http://192.168.100.195:81/stream"
                     alt="Shiitake Camera Stream" class="camera-stream">
            </div>
            
            <div class="camera-card">
                <div class="camera-header">
                    <h2>White Oyster Camera</h2>
                    <button class="capture-btn" onclick="captureImage('white_oyster')">Capture</button>
                </div>
                <img id="white_oyster-stream"
                     src="http://192.168.100.196:81/stream"
                     alt="White Oyster Camera Stream" class="camera-stream">
            </div>
            
            
        </div>
    </div>
</div>

<!-- Upload Status Modal -->
<div id="uploadStatusModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <p id="uploadMessage"></p>
    </div>
</div>

<script src="{{ url_for('static', filename='js/live.js') }}"></script>

<!-- CSS Styling -->
<style>
    .camera-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
    }
    .capture-btn {
        background-color: #007BFF;
        color: white;
        border: none;
        padding: 8px 12px;
        font-size: 14px;
        cursor: pointer;
        border-radius: 5px;
        transition: background-color 0.3s ease;
    }
    .capture-btn:hover {
        background-color: #0056b3;
    }
    @media (max-width: 600px) {
        .camera-header {
            flex-direction: column;
            align-items: flex-start;
        }
        .capture-btn {
            width: 100%;
        }
    }
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 20px;
        box-shadow: 0px 0px 10px gray;
        border-radius: 8px;
    }
    .modal-content {
        text-align: center;
    }
    .close {
        float: right;
        font-size: 24px;
        cursor: pointer;
    }
</style>

{% endblock %}
